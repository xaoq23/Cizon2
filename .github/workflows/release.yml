name: release-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (v0.6.0 or 0.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Normalize release tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHECKOUT_REF=refs/tags/$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Name release asset
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $meta.packages[0].version
          $tag = $env:RELEASE_TAG

          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with 'v', got '$tag'"
          }
          $tagVersion = $tag.Substring(1)
          if ($tagVersion -ne $version) {
            throw "Tag $tag does not match Cargo.toml version $version"
          }

          $asset = "cizon2-v$version-windows-x86_64.exe"
          Copy-Item target/release/cizon2.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii

          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT=cizon2-v$version-windows-x86_64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(env.RELEASE_TAG, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = $env:ASSET
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset "$asset.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset "$asset.sha256" --title $tag --generate-notes --verify-tag --repo $env:GITHUB_REPOSITORY
          }
