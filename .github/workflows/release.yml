name: release-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (v0.10.2 or 0.10.2)"
        required: true
        type: string

# A re-run or a duplicate dispatch for the same tag must not publish concurrently.
concurrency:
  group: release-${{ startsWith(inputs.tag || github.ref_name, 'v') && (inputs.tag || github.ref_name) || format('v{0}', inputs.tag || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - id: normalize
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$REF_TAG"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64.exe
          - os: ubuntu-latest
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version=$(cargo pkgid | sed 's/.*@//')
          tag="$TAG"
          if [ "v$version" != "$tag" ]; then
            echo "Tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --locked

      # Linux has no local gate for .so support: run the whole suite here so the release
      # fails before publishing when shared libraries break.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cargo test --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "cizon-v$env:VERSION-windows-x86_64.exe"
          Copy-Item target/release/cizon.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          asset="cizon-v${VERSION}-linux-x86_64"
          cp target/release/cizon "$asset"
          chmod +x "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tag="$TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
